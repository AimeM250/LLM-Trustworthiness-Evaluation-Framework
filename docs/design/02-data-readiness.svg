<text x="481.0" y="693.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#455469" stroke="white" stroke-width="5" paint-order="stroke">valid structure</text>
<polyline points="918,703.0 992,703.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="955.0" y="693.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#455469" stroke="white" stroke-width="5" paint-order="stroke">saved report</text>
<text x="44" y="65.6" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#253449">02 · Data provision and readiness</text>
<text x="44" y="111.26" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#253449">Prepare only the evidence your selected metrics need; validation is not scientific validation</text>
<rect x="44" y="150" width="400" height="142" rx="10" fill="#edf3ff" stroke="#365cbd"/>
<text x="244.0" y="191.14219759926132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.359187442289937" font-weight="700" fill="#163566">01  Choose scope</text>
<text x="244.0" y="214.75069252077563" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.359187442289937" font-weight="400" fill="#163566">Sector + use case + systems</text>
<text x="244.0" y="238.35918744228997" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.359187442289937" font-weight="400" fill="#163566">Select metrics allowed by your role</text>
<text x="244.0" y="261.9676823638043" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.359187442289937" font-weight="400" fill="#163566">Define population and failure criteria</text>
<rect x="518" y="150" width="400" height="142" rx="10" fill="#edf3ff" stroke="#365cbd"/>
<text x="718.0" y="194.6140350877193" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.340677274581804" font-weight="700" fill="#163566">02  Download starter files</text>
<text x="718.0" y="215.47735618115055" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.340677274581804" font-weight="400" fill="#163566">Selected metric profile + synthetic example</text>
<text x="718.0" y="236.3406772745818" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.340677274581804" font-weight="400" fill="#163566">Read metric-specific requirements</text>
<text x="718.0" y="257.20399836801306" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.340677274581804" font-weight="400" fill="#163566">Replace fixtures with your own evidence</text>
<rect x="992" y="150" width="400" height="142" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1192.0" y="193.98579782790307" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="700" fill="#253449">03  Capture and review</text>
<text x="1192.0" y="215.3458646616541" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="400" fill="#253449">Run systems outside the web workspace</text>
<text x="1192.0" y="236.70593149540517" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="400" fill="#253449">Retain every declared trial and failure</text>
<text x="1192.0" y="258.06599832915623" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="400" fill="#253449">Add required annotations / complete traces</text>
<rect x="44" y="372" width="400" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="244.0" y="412.42105263157896" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.491228070175442" font-weight="700" fill="#253449">cases.jsonl  ·  Test definition</text>
<text x="244.0" y="434.8491228070176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.491228070175442" font-weight="400" fill="#253449">IDs · sector · provenance · prompts</text>
<text x="244.0" y="457.27719298245614" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.491228070175442" font-weight="400" fill="#253449">References or scope flags as required</text>
<text x="244.0" y="479.70526315789476" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.491228070175442" font-weight="400" fill="#253449">Groups / canaries / agent policy if used</text>
<text x="244.0" y="502.1333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.491228070175442" font-weight="400" fill="#253449">Owner: dataset author + domain reviewer</text>
<rect x="518" y="372" width="400" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="718.0" y="413.3863928112965" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="700" fill="#253449">observations.json  ·  Evidence</text>
<text x="718.0" y="435.2674368848951" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#253449">Systems + versions + declared trials</text>
<text x="718.0" y="457.1484809584938" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#253449">Response or error + canonical prompt hash</text>
<text x="718.0" y="479.0295250320924" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#253449">Measurements / labels / trace events</text>
<text x="718.0" y="500.910569105691" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#253449">Owner: collection engineer + adjudicators</text>
<rect x="992" y="372" width="400" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1192.0" y="408.8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#253449">profile.json  ·  Measurement plan</text>
<text x="1192.0" y="433.28000000000003" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#253449">Sector + selected metric identifiers</text>
<text x="1192.0" y="457.76" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#253449">Grouping dimensions + minimum_cases</text>
<text x="1192.0" y="482.24" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#253449">Version + empty thresholds object</text>
<text x="1192.0" y="506.72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#253449">Owner: study lead</text>
<rect x="44" y="630" width="400" height="146" rx="10" fill="#fff7e8" stroke="#d7ae62"/>
<text x="244.0" y="665.3057644110276" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="700" fill="#78521d">04  Check readiness</text>
<text x="244.0" y="686.6658312447786" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="400" fill="#78521d">Validate all three files and prompt hashes</text>
<text x="244.0" y="708.0258980785296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="400" fill="#78521d">Show per-metric evidence availability</text>
<text x="244.0" y="729.3859649122807" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="400" fill="#78521d">Explain missing / inapplicable inputs</text>
<text x="244.0" y="750.7460317460318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.705931495405181" font-weight="400" fill="#78521d">No report saved by this check</text>
<rect x="518" y="630" width="400" height="146" rx="10" fill="#edf3ff" stroke="#365cbd"/>
<text x="718.0" y="660.2119487908961" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.828354670459934" font-weight="700" fill="#163566">05  Run evaluation</text>
<text x="718.0" y="684.4585111427217" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.828354670459934" font-weight="400" fill="#163566">Revalidate the current input files</text>
<text x="718.0" y="708.7050734945472" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.828354670459934" font-weight="400" fill="#163566">Score each declared case/system/trial</text>
<text x="718.0" y="732.9516358463727" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.828354670459934" font-weight="400" fill="#163566">Aggregate cases; show coverage</text>
<text x="718.0" y="757.1981981981982" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.828354670459934" font-weight="400" fill="#163566">Save only the derived report</text>
<rect x="992" y="630" width="400" height="146" rx="10" fill="#edf8f3" stroke="#6a9c84"/>
<text x="1192.0" y="664.3863928112966" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="700" fill="#21533a">06  Inspect evidence</text>
<text x="1192.0" y="686.2674368848952" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#21533a">Read scope + denominators + warnings</text>
<text x="1192.0" y="708.1484809584938" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#21533a">Check failures alongside quality means</text>
<text x="1192.0" y="730.0295250320925" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#21533a">Export report and retain source inputs</text>
<text x="1192.0" y="751.9105691056911" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.08900299529311" font-weight="400" fill="#21533a">Publish only claims supported by evidence</text>
<rect x="44" y="845" width="1348" height="58" rx="10" fill="#f4f6f9" stroke="#cbd5e1"/>
<text x="718.0" y="878.8266119845067" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.083162451583506" font-weight="700" fill="#455469">SCORING STATES   Scored = evidence supplied   ·   Missing = required evidence absent   ·   Error = declared failure   ·   N/A = outside the metric’s scope</text>
</svg>