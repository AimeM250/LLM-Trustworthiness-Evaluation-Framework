<text x="1208.0" y="301.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#455469" stroke="white" stroke-width="5" paint-order="stroke">assemble all three</text>
<polyline points="244,532 244,630" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="260.0" y="571.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#455469" stroke="white" stroke-width="5" paint-order="stroke">three-file check</text>
<polyline points="718,532 718,581 380,581 380,630" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="1192,532 1192,605 425,605 425,630" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
