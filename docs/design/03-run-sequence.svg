<rect x="48" y="875" width="1292" height="44" rx="10" fill="#f4f6f9" stroke="#cbd5e1"/>
<text x="694.0" y="901.3406076166025" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.564398801882756" font-weight="700" fill="#455469">INVALID RUN → 400; INVALID PREFLIGHT → 200 + valid:false   ·   NO SESSION → 401   ·   NO PERMISSION → 403   ·   INACCESSIBLE REPORT → 404   ·   BUSY EVALUATOR → 409</text>
