<rect x="639" y="234" width="2" height="622" rx="10" fill="#f4f6f9" stroke="#cbd5e1"/>
<text x="640.0" y="545.32" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="1" font-weight="700" fill="#455469"></text>
<rect x="774" y="145" width="216" height="68" rx="10" fill="#142b4b" stroke="#142b4b"/>
