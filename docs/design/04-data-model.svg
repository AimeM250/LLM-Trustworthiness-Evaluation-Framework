<text x="204.0" y="211.8421052631579" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.982456140350878" font-weight="700" fill="#163566">users</text>
<text x="204.0" y="229.49824561403508" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.982456140350878" font-weight="400" fill="#163566">id (PK) · name · email (unique)</text>
<text x="204.0" y="247.15438596491228" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.982456140350878" font-weight="400" fill="#163566">role: viewer / researcher / admin</text>
<text x="204.0" y="264.8105263157895" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.982456140350878" font-weight="400" fill="#163566">salt · password_hash · created</text>
<text x="204.0" y="282.4666666666667" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.982456140350878" font-weight="400" fill="#163566">Contains identity, not model credentials</text>
<rect x="438" y="153" width="320" height="180" rx="10" fill="#edf3ff" stroke="#365cbd"/>
<text x="598.0" y="205.2328548644338" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.73631047315258" font-weight="700" fill="#163566">sessions</text>
