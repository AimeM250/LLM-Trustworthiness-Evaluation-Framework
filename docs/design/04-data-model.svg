<text x="204.0" y="696.343653250774" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.273477812177504" font-weight="700" fill="#253449">Case dataset  ·  JSONL</text>
<text x="204.0" y="717.1155830753354" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.273477812177504" font-weight="400" fill="#253449">Case ID + messages + sector</text>
