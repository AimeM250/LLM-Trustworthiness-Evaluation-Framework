<rect x="44" y="420" width="320" height="130" rx="10" fill="#f4f6f9" stroke="#cbd5e1"/>
<text x="204.0" y="460.859649122807" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.035087719298245" font-weight="700" fill="#455469">auth_attempts</text>
<text x="204.0" y="479.9473684210526" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.035087719298245" font-weight="400" fill="#455469">address · attempted</text>
