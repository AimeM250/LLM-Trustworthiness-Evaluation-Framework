<text x="1165.0" y="715.32" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#253449">ID + version + sector</text>
<text x="1165.0" y="738.44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#253449">Selected metrics + grouping dimensions</text>
<text x="1165.0" y="761.5600000000001" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#253449">minimum_cases (starter: 20)</text>
<text x="1165.0" y="784.6800000000001" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#253449">thresholds: {} in v0.1</text>
<rect x="44" y="862" width="1338" height="55" rx="10" fill="#fff7e8" stroke="#d7ae62"/>
<text x="713.0" y="893.6677074041035" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.024085637823374" font-weight="700" fill="#78521d">Relationships shown are logical; the current SQLite schema does not declare SQL foreign keys. Hashes support reconstruction, not provider authentication or tamper-proof custody.</text>
