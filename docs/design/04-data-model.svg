<text x="598.0" y="248.0356193514088" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.73631047315258" font-weight="400" fill="#163566">user_id · csrf · expires</text>
<text x="598.0" y="269.4370015948963" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.73631047315258" font-weight="400" fill="#163566">12-hour expiration</text>
<text x="598.0" y="290.83838383838383" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15.73631047315258" font-weight="400" fill="#163566">Current role resolved per request</text>
<rect x="832" y="153" width="550" height="180" rx="10" fill="#edf3ff" stroke="#365cbd"/>
<text x="1107.0" y="204.14496768236378" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.189596799015085" font-weight="700" fill="#163566">runs</text>
<text x="1107.0" y="226.1628193290243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.189596799015085" font-weight="400" fill="#163566">id (PK) · name</text>
<text x="1107.0" y="248.18067097568482" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.189596799015085" font-weight="400" fill="#163566">owner_id · shared_sample</text>
