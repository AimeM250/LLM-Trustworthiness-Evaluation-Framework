<text x="656.0" y="715.9154704944178" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.427432216905903" font-weight="400" fill="#253449">Systems + versions + generation settings</text>
<text x="656.0" y="738.2567783094099" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.427432216905903" font-weight="400" fill="#253449">Records keyed by (system_id, case_id, trial)</text>
<text x="656.0" y="760.5980861244019" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.427432216905903" font-weight="400" fill="#253449">Prompt hash binds each record to messages</text>
<text x="656.0" y="782.939393939394" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16.427432216905903" font-weight="400" fill="#253449">Response/error + resources + labels + trace</text>
